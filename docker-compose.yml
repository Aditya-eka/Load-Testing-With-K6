version: '3.8'

networks:
  k6:
  grafana:
  timescaledb:

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescale-k6
    command: postgres -c shared_preload_libraries=timescaledb
    networks:
      - k6
      - grafana
      - timescaledb
    ports:
      - "5433:5432"
    environment:
      - PGDATA=/var/lib/postgresql/data/timescaledb
      - POSTGRES_DB=k6
      - POSTGRES_USER=k6
      - POSTGRES_PASSWORD=k6

  grafana:
    image: grafana/grafana:10.0.2
    container_name: grafana-k6
    networks:
      - grafana
      - timescaledb
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana:/etc/grafana/provisioning/
    
  k6:
    image: itdevopsnova/k6_timescaledb:latest
    container_name: k6
    networks:
      - k6
    ports:
      - "6565:6565"
    entrypoint: ["/bin/sh", "-c"]
    command: ["/scripts/looping.sh"]
    #command: run /scripts/main.js --log-output=file=/logs/k6.log
    environment:
      - K6_OUT=timescaledb=postgresql://k6:k6@timescaledb:5432/k6
    volumes:
      - ./scripts:/scripts
      - ./logs:/logs
    profiles:
      - test